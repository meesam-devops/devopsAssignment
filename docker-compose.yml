name: devops-assessment

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # rotate each log file at 10 MB
    max-file: "3"     # keep 3 files, so max 30 MB per container

services:
  app:
    image: ${IMAGE_REPO}:${APP_TAG:?APP_TAG must be set}
    env_file: app.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      APP_VERSION: ${APP_TAG}          # version shown = image tag deployed
    expose:
      - "8080"                         # visible to nginx only, NOT the host
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    healthcheck:
      # bash built-in /dev/tcp: no curl needed inside the image
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${PROXY_PORT:-80}:80"         # the ONLY port published to the host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging
