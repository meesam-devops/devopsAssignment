name: build-test-publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: v
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-assessment" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"      # v2.0.0 -> 2.0.0
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: docker build --pull --build-arg BUILD_VERSION=${{ steps.v.outputs.tag }} -t ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }} .

      - name: Smoke test
        run: ./scripts/smoke-test.sh ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: docker push ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
